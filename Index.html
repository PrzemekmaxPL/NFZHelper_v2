<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFZ Helper v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: radial-gradient(60rem 30rem at 50% -10rem, #ccfbf1 0%, transparent 60%), #fafaf9; }
  </style>
</head>
<body class="text-zinc-900 antialiased p-4 sm:p-8">
  <div class="mx-auto max-w-2xl">
    <header class="mb-8">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-teal-600 text-white shadow font-bold text-lg">🏥</span>
        <span class="text-sm font-semibold tracking-wider uppercase text-teal-700">NFZ Helper</span>
      </div>
      <h1 class="mt-4 text-2xl sm:text-3xl font-bold tracking-tight text-zinc-900">Znajdź wolny termin NFZ</h1>
      <p class="mt-1 text-sm text-zinc-600">Pobiera aktualne wolne terminy bezpośrednio z bazy NFZ.</p>
    </header>

    <form id="search-form" class="space-y-5 rounded-2xl bg-white p-5 sm:p-7 shadow-sm ring-1 ring-zinc-900/5">
      <div>
        <label for="benefit" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Świadczenie / Specjalizacja</label>
        <input type="text" id="benefit" placeholder="np. kardiolog, okulista, rezonans" required class="mt-1.5 block w-full rounded-lg border-0 px-3.5 py-2.5 text-zinc-900 ring-1 ring-zinc-200 focus:ring-2 focus:ring-teal-600 text-base" />
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="province" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Województwo</label>
          <select id="province" class="mt-1.5 block w-full rounded-lg border-0 bg-white px-3 py-2.5 text-zinc-900 ring-1 ring-zinc-200 focus:ring-2 focus:ring-teal-600 text-base">
            <option value="">Cała Polska</option>
            <option value="01">dolnośląskie</option>
            <option value="02">kujawsko-pomorskie</option>
            <option value="03">lubelskie</option>
            <option value="04">lubuskie</option>
            <option value="05">łódzkie</option>
            <option value="06">małopolskie</option>
            <option value="07">mazowieckie</option>
            <option value="08">opolskie</option>
            <option value="09">podkarpackie</option>
            <option value="10">podlaskie</option>
            <option value="11">pomorskie</option>
            <option value="12">śląskie</option>
            <option value="13">świętokrzyskie</option>
            <option value="14">warmińsko-mazurskie</option>
            <option value="15">wielkopolskie</option>
            <option value="16">zachodniopomorskie</option>
          </select>
        </div>

        <div>
          <span class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Tryb</span>
          <div class="mt-1.5 flex gap-2">
            <label class="flex-1 text-center cursor-pointer rounded-lg bg-zinc-100 py-2.5 text-sm font-medium has-[:checked]:bg-teal-600 has-[:checked]:text-white transition">
              <input type="radio" name="case" value="1" checked class="sr-only" /> Stabilny
            </label>
            <label class="flex-1 text-center cursor-pointer rounded-lg bg-zinc-100 py-2.5 text-sm font-medium has-[:checked]:bg-teal-600 has-[:checked]:text-white transition">
              <input type="radio" name="case" value="2" class="sr-only" /> Pilny (CITO)
            </label>
          </div>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full rounded-lg bg-teal-600 py-3 text-sm font-semibold text-white shadow hover:bg-teal-700 transition active:scale-[0.99]">
        Szukaj wolnych terminów
      </button>
    </form>

    <div id="status" class="mt-6 text-center text-sm font-medium text-zinc-600 hidden"></div>
    <div id="results" class="mt-6 space-y-4"></div>
  </div>

  <script>
    const form = document.getElementById("search-form");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultsEl.innerHTML = "";
      statusEl.classList.remove("hidden");
      statusEl.textContent = "Pobieram dane z oficjalnego API NFZ…";
      submitBtn.disabled = true;

      const benefit = encodeURIComponent(document.getElementById("benefit").value.trim());
      const province = document.getElementById("province").value;
      const caseType = document.querySelector('input[name="case"]:checked').value;

      let url = `https://api.nfz.gov.pl/app-itl-api/queues?page=1&limit=25&format=json&case=${caseType}&benefit=${benefit}`;
      if (province) url += `&province=${province}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Błąd HTTP ${res.status}`);
        const data = await res.json();
        const items = data.data || [];

        if (items.length === 0) {
          statusEl.textContent = "Nie znaleziono placówek dla podanych kryteriów.";
          return;
        }

        statusEl.textContent = `Znaleziono ${items.length} placówek:`;
        
        items.forEach((item) => {
          const attr = item.attributes;
          const date = attr.dates?.applicable?.first_available_date || "Brak danych o terminie";
          const card = document.createElement("div");
          card.className = "rounded-xl bg-white p-5 shadow-sm ring-1 ring-zinc-900/5";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-4">
              <div>
                <h3 class="font-semibold text-zinc-900 leading-snug">${attr.provider || "Placówka"}</h3>
                <p class="text-xs text-zinc-500 mt-0.5">${attr.place || ""}</p>
                <p class="text-sm text-zinc-600 mt-2">${attr.address || ""}, ${attr.locality || ""}</p>
                ${attr.phone ? `<a href="tel:${attr.phone.split(/[\/,;]/)[0]}" class="inline-block mt-3 text-xs font-semibold text-teal-700 bg-teal-50 px-2.5 py-1 rounded-full ring-1 ring-teal-100">📞 ${attr.phone}</a>` : ""}
              </div>
              <div class="text-right shrink-0">
                <span class="text-xs uppercase text-zinc-400 font-semibold block">Pierwszy termin</span>
                <span class="text-lg font-bold text-teal-700">${date}</span>
              </div>
            </div>
          `;
          resultsEl.appendChild(card);
        });
      } catch (err) {
        statusEl.textContent = "Wystąpił błąd podczas łączenia z NFZ: " + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
