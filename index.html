<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFZ Helper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: radial-gradient(60rem 30rem at 50% -10rem, #ccfbf1 0%, transparent 60%), #fafaf9; }
  </style>
</head>
<body class="text-zinc-900 antialiased p-4 sm:p-8">
  <div class="mx-auto max-w-2xl">
    <header class="mb-8">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-teal-600 text-white shadow font-bold text-lg">🏥</span>
        <span class="text-sm font-semibold tracking-wider uppercase text-teal-700">NFZ Helper</span>
      </div>
      <h1 class="mt-4 text-2xl sm:text-3xl font-bold tracking-tight text-zinc-900">Znajdź najszybszy termin NFZ</h1>
      <p class="mt-1 text-sm text-zinc-600">Przeszukuje bazę NFZ i układa placówki od najwcześniej dostępnego terminu.</p>
    </header>

    <form id="search-form" class="space-y-5 rounded-2xl bg-white p-5 sm:p-7 shadow-sm ring-1 ring-zinc-900/5">
      <div>
        <label for="benefit" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Świadczenie / Specjalizacja / Kod resortowy</label>
        <input type="text" id="benefit" placeholder="np. kardiolog, okulista lub kod: 1100, 1600" required class="mt-1.5 block w-full rounded-lg border-0 px-3.5 py-2.5 text-zinc-900 ring-1 ring-zinc-200 focus:ring-2 focus:ring-teal-600 text-base" />
        <p id="benefit-hint" class="mt-1.5 text-xs text-teal-700 font-medium hidden"></p>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="province" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Województwo</label>
          <select id="province" class="mt-1.5 block w-full rounded-lg border-0 bg-white px-3 py-2.5 text-zinc-900 ring-1 ring-zinc-200 focus:ring-2 focus:ring-teal-600 text-base">
            <option value="">Cała Polska</option>
            <option value="01">dolnośląskie</option>
            <option value="02">kujawsko-pomorskie</option>
            <option value="03">lubelskie</option>
            <option value="04">lubuskie</option>
            <option value="05">łódzkie</option>
            <option value="06">małopolskie</option>
            <option value="07">mazowieckie</option>
            <option value="08">opolskie</option>
            <option value="09">podkarpackie</option>
            <option value="10">podlaskie</option>
            <option value="11">pomorskie</option>
            <option value="12">śląskie</option>
            <option value="13">świętokrzyskie</option>
            <option value="14">warmińsko-mazurskie</option>
            <option value="15">wielkopolskie</option>
            <option value="16">zachodniopomorskie</option>
          </select>
        </div>

        <div>
          <span class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Tryb</span>
          <div class="mt-1.5 flex gap-2">
            <label class="flex-1 text-center cursor-pointer rounded-lg bg-zinc-100 py-2.5 text-sm font-medium has-[:checked]:bg-teal-600 has-[:checked]:text-white transition">
              <input type="radio" name="case" value="1" checked class="sr-only" /> Stabilny
            </label>
            <label class="flex-1 text-center cursor-pointer rounded-lg bg-zinc-100 py-2.5 text-sm font-medium has-[:checked]:bg-teal-600 has-[:checked]:text-white transition">
              <input type="radio" name="case" value="2" class="sr-only" /> Pilny (CITO)
            </label>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2">
        <button type="button" id="locate-btn" class="text-xs text-teal-700 font-semibold hover:underline inline-flex items-center gap-1.5">
          <span>📍</span> <span id="locate-text">Udostępnij lokalizację (opcjonalnie)</span>
        </button>
      </div>

      <button type="submit" id="submit-btn" class="w-full rounded-lg bg-teal-600 py-3 text-sm font-semibold text-white shadow hover:bg-teal-700 transition active:scale-[0.99]">
        Szukaj najszybszych terminów
      </button>
    </form>

    <div id="status" class="mt-6 text-center text-sm font-medium text-zinc-600 hidden"></div>
    <div id="results" class="mt-6 space-y-4"></div>
  </div>

  <script>
    const MONTHS = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"];
    const CODES = {
      "1010": "chorób wewnętrznych",
      "1020": "diabetolog",
      "1030": "endokrynolog",
      "1050": "gastroenterolog",
      "1100": "kardiolog",
      "1101": "kardiologii dziecięcej",
      "1120": "dermatolog",
      "1200": "neurolog",
      "1220": "onkolog",
      "1240": "rehabilitac",
      "1270": "chorób płuc",
      "1280": "reumatolog",
      "1340": "alergolog",
      "1450": "chirurgii ogólnej",
      "1500": "ortoped",
      "1570": "neurochirurg",
      "1580": "otorynolaryngolog",
      "1600": "okulist",
      "1610": "okulist",
      "1640": "urolog",
      "1700": "ginekolog",
      "1790": "psychiatrycz"
    };

    let userCoords = null;
    const benefitInput = document.getElementById("benefit");
    const hintEl = document.getElementById("benefit-hint");
    const locateBtn = document.getElementById("locate-btn");
    const locateText = document.getElementById("locate-text");

    benefitInput.addEventListener("input", () => {
      const val = benefitInput.value.trim();
      if (CODES[val]) {
        hintEl.textContent = `Kod resortowy ${val} → szukam: ${CODES[val]}`;
        hintEl.classList.remove("hidden");
      } else {
        hintEl.classList.add("hidden");
      }
    });

    locateBtn.addEventListener("click", () => {
      if (!navigator.geolocation) return alert("Twoja przeglądarka nie obsługuje geolokalizacji.");
      locateText.textContent = "Pobieram pozycję…";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          locateText.textContent = "Lokalizacja zapisana ✓";
          locateBtn.classList.replace("text-teal-700", "text-emerald-600");
        },
        () => {
          locateText.textContent = "Błąd pobierania pozycji";
        }
      );
    });

    function calcDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return null;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    const form = document.getElementById("search-form");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultsEl.innerHTML = "";
      statusEl.classList.remove("hidden");
      statusEl.textContent = "Pobieram dane i analizuję terminy…";
      submitBtn.disabled = true;

      const rawBenefit = benefitInput.value.trim();
      const codeMatch = CODES[rawBenefit];
      const searchTerm = codeMatch || rawBenefit;
      const province = document.getElementById("province").value;
      const caseType = document.querySelector('input[name="case"]:checked').value;

      try {
        let url = `https://api.nfz.gov.pl/app-itl-api/queues?page=1&limit=50&format=json&case=${caseType}&benefit=${encodeURIComponent(searchTerm)}`;
        if (province) url += `&province=${province}`;

        const res = await fetch(url);
        if (!res.ok) throw new Error(`Błąd HTTP ${res.status}`);
        const json = await res.json();
        const rawItems = json.data || [];

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const parsed = [];

        rawItems.forEach((item) => {
          const attr = item.attributes;
          // Obsługa formatu z myślnikiem i podkreślnikiem
          const rawDate = attr.dates?.applicable?.['first-available-date'] || 
                          attr.dates?.applicable?.first_available_date;
          if (!rawDate) return;

          const dateObj = new Date(rawDate);
          if (isNaN(dateObj.getTime())) return;

          const diffDays = Math.round((dateObj - today) / (1000 * 60 * 60 * 24));
          if (diffDays < 0) return; // Pomijamy historyczne zgłoszenia z przeszłości

          let dist = null;
          if (userCoords && attr.latitude && attr.longitude) {
            dist = calcDistance(userCoords.lat, userCoords.lng, parseFloat(attr.latitude), parseFloat(attr.longitude));
          }

          parsed.push({
            provider: attr.provider || "Placówka",
            place: attr.place || "",
            address: [attr.address, attr.locality].filter(Boolean).join(", "),
            phone: attr.phone ? attr.phone.split(/[\/,;]/)[0].trim() : null,
            date: dateObj,
            days: diffDays,
            dist: dist
          });
        });

        // SORTOWANIE OD NAJBLIŻSZEJ DATY
        parsed.sort((a, b) => a.date - b.date);

        if (parsed.length === 0) {
          statusEl.textContent = "Brak aktywnych wolnych terminów dla podanych kryteriów.";
          return;
        }

        statusEl.textContent = `Znaleziono ${parsed.length} placówek z wolnymi terminami (posortowane chronologicznie):`;

        parsed.forEach((item, idx) => {
          const day = String(item.date.getDate()).padStart(2, "0");
          const month = MONTHS[item.date.getMonth()];
          const year = item.date.getFullYear();
          const card = document.createElement("article");
          card.className = "rounded-2xl bg-white p-5 shadow-sm ring-1 ring-zinc-900/5";

          card.innerHTML = `
            <div class="flex items-start justify-between gap-4">
              <div class="min-w-0 flex-1">
                <span class="text-[11px] font-bold text-teal-700 uppercase tracking-wider">#${idx + 1}</span>
                <h3 class="mt-1 font-semibold text-zinc-900 leading-snug">${item.provider}</h3>
                ${item.place ? `<p class="text-xs text-zinc-500 mt-0.5">${item.place}</p>` : ""}
                <p class="text-sm text-zinc-600 mt-2">${item.address}</p>
                <div class="mt-3 flex flex-wrap items-center gap-2">
                  ${item.phone ? `<a href="tel:${item.phone}" class="inline-flex items-center gap-1.5 rounded-full bg-teal-50 px-3 py-1 text-xs font-semibold text-teal-700 ring-1 ring-teal-100 hover:bg-teal-100">📞 ${item.phone}</a>` : ""}
                  ${item.dist != null ? `<span class="inline-flex items-center rounded-full bg-zinc-100 px-2.5 py-1 text-xs text-zinc-600 font-medium">📍 ${item.dist.toFixed(1)} km</span>` : ""}
                </div>
              </div>
              <div class="text-right shrink-0">
                <div class="flex items-baseline gap-1 justify-end">
                  <span class="text-3xl font-bold tracking-tight text-zinc-900 tabular-nums">${day}</span>
                  <span class="text-base font-semibold text-zinc-700">${month}</span>
                  <span class="text-xs text-zinc-400">${year}</span>
                </div>
                <div class="text-xs font-medium text-teal-700 mt-1">
                  ${item.days === 0 ? "Dziś" : (item.days === 1 ? "Jutro" : `za ${item.days} dni`)}
                </div>
              </div>
            </div>
          `;
          resultsEl.appendChild(card);
        });

      } catch (err) {
        statusEl.textContent = "Błąd komunikacji z API NFZ: " + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
