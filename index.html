<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFZ Helper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: radial-gradient(60rem 30rem at 50% -10rem, #ccfbf1 0%, transparent 60%), #fafaf9; }
  </style>
</head>
<body class="text-zinc-900 antialiased p-4 sm:p-8">
  <div class="mx-auto max-w-2xl">
    <header class="mb-8">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-teal-600 text-white shadow font-bold text-lg">🏥</span>
        <span class="text-sm font-semibold tracking-wider uppercase text-teal-700">NFZ Helper v2</span>
      </div>
      <h1 class="mt-4 text-2xl sm:text-3xl font-bold tracking-tight text-zinc-900">Znajdź najszybszy termin NFZ</h1>
      <p class="mt-1 text-sm text-zinc-600">Przeszukuje bazę NFZ i pokazuje tylko placówki z wolnymi terminami.</p>
    </header>

    <form id="search-form" class="space-y-5 rounded-2xl bg-white p-5 sm:p-7 shadow-sm ring-1 ring-zinc-900/5">
      <div>
        <label for="benefit" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Świadczenie / Specjalizacja / Kod</label>
        <input type="text" id="benefit" placeholder="np. kardiolog, okulista, rezonans lub 1100" required class="mt-1.5 block w-full rounded-lg border-0 px-3.5 py-2.5 text-zinc-900 ring-1 ring-zinc-200 focus:ring-2 focus:ring-teal-600 text-base" />
        <p id="benefit-hint" class="mt-1.5 text-xs text-teal-700 font-medium hidden"></p>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="province" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Województwo</label>
          <select id="province" class="mt-1.5 block w-full rounded-lg border-0 bg-white px-3 py-2.5 text-zinc-900 ring-1 ring-zinc-200 focus:ring-2 focus:ring-teal-600 text-base">
            <option value="">Cała Polska</option>
            <option value="01">dolnośląskie</option>
            <option value="02">kujawsko-pomorskie</option>
            <option value="03">lubelskie</option>
            <option value="04">lubuskie</option>
            <option value="05">łódzkie</option>
            <option value="06">małopolskie</option>
            <option value="07">mazowieckie</option>
            <option value="08">opolskie</option>
            <option value="09">podkarpackie</option>
            <option value="10">podlaskie</option>
            <option value="11">pomorskie</option>
            <option value="12">śląskie</option>
            <option value="13">świętokrzyskie</option>
            <option value="14">warmińsko-mazurskie</option>
            <option value="15">wielkopolskie</option>
            <option value="16">zachodniopomorskie</option>
          </select>
        </div>

        <div>
          <span class="block text-xs font-semibold uppercase tracking-wider text-zinc-500">Tryb</span>
          <div class="mt-1.5 flex gap-2">
            <label class="flex-1 text-center cursor-pointer rounded-lg bg-zinc-100 py-2.5 text-sm font-medium has-[:checked]:bg-teal-600 has-[:checked]:text-white transition">
              <input type="radio" name="case" value="1" checked class="sr-only" /> Stabilny
            </label>
            <label class="flex-1 text-center cursor-pointer rounded-lg bg-zinc-100 py-2.5 text-sm font-medium has-[:checked]:bg-teal-600 has-[:checked]:text-white transition">
              <input type="radio" name="case" value="2" class="sr-only" /> Pilny (CITO)
            </label>
          </div>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full rounded-lg bg-teal-600 py-3 text-sm font-semibold text-white shadow hover:bg-teal-700 transition active:scale-[0.99]">
        Szukaj najszybszych terminów
      </button>
    </form>

    <div id="status" class="mt-6 text-center text-sm font-medium text-zinc-600 hidden"></div>
    <div id="results" class="mt-6 space-y-4"></div>
  </div>

  <script>
    const MONTHS = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"];
    
    // Mapowanie haseł i kodów resortowych na oficjalne nazwy NFZ
    const DICT = {
      "1100": "świadczenia z zakresu kardiologii",
      "kardiolog": "świadczenia z zakresu kardiologii",
      "poradnia kardiologiczna": "świadczenia z zakresu kardiologii",
      "1600": "świadczenia z zakresu okulistyki",
      "1610": "świadczenia z zakresu okulistyki",
      "okulista": "świadczenia z zakresu okulistyki",
      "poradnia okulistyczna": "świadczenia z zakresu okulistyki",
      "1200": "świadczenia z zakresu neurologii",
      "neurolog": "świadczenia z zakresu neurologii",
      "1500": "świadczenia z zakresu ortopedii",
      "ortopeda": "świadczenia z zakresu ortopedii",
      "1120": "świadczenia z zakresu dermatologii",
      "dermatolog": "świadczenia z zakresu dermatologii",
      "1700": "świadczenia z zakresu ginekologii",
      "ginekolog": "świadczenia z zakresu ginekologii",
      "1030": "świadczenia z zakresu endokrynologii",
      "endokrynolog": "świadczenia z zakresu endokrynologii",
      "rezonans": "badania rezonansu magnetycznego",
      "tomografia": "badania tomografii komputerowej"
    };

    const benefitInput = document.getElementById("benefit");
    const hintEl = document.getElementById("benefit-hint");

    benefitInput.addEventListener("input", () => {
      const q = benefitInput.value.trim().toLowerCase();
      if (DICT[q]) {
        hintEl.textContent = `Dopasowano: ${DICT[q]}`;
        hintEl.classList.remove("hidden");
      } else {
        hintEl.classList.add("hidden");
      }
    });

    // Pancerny czytnik daty z JSON NFZ
    function parseDate(attr) {
      if (!attr || !attr.dates) return null;
      const d = attr.dates?.applicable?.['first-available-date'] || 
                attr.dates?.applicable?.date || 
                attr.dates?.applicable?.first_available_date;
      if (d) return d;
      // Wyszukanie formatu YYYY-MM-DD wewnątrz obiektu dates
      const match = JSON.stringify(attr.dates).match(/\b\d{4}-\d{2}-\d{2}\b/);
      return match ? match[0] : null;
    }

    const form = document.getElementById("search-form");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultsEl.innerHTML = "";
      statusEl.classList.remove("hidden");
      submitBtn.disabled = true;

      const raw = benefitInput.value.trim().toLowerCase();
      const term = DICT[raw] || benefitInput.value.trim();
      const province = document.getElementById("province").value;
      const caseType = document.querySelector('input[name="case"]:checked').value;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const parsed = [];
      let page = 1;
      const maxPages = 3; // Pobiera do 3 stron, żeby pominąć szpitale bez wolnych terminów

      try {
        while (page <= maxPages && parsed.length < 20) {
          statusEl.textContent = `Przeszukuję bazę NFZ (strona ${page} z ${maxPages})…`;

          let url = `https://api.nfz.gov.pl/app-itl-api/queues?page=${page}&limit=25&format=json&case=${caseType}&benefit=${encodeURIComponent(term)}`;
          if (province) url += `&province=${province}`;

          const res = await fetch(url);
          if (!res.ok) break;
          const json = await res.json();
          const items = json.data || [];
          if (items.length === 0) break;

          items.forEach((item) => {
            const attr = item.attributes;
            const dateStr = parseDate(attr);
            if (!dateStr) return; // Odrzucamy placówki bez dat

            const dateObj = new Date(dateStr);
            if (isNaN(dateObj.getTime())) return;

            const diff = Math.round((dateObj - today) / (1000 * 60 * 60 * 24));
            if (diff < 0) return; // Odrzucamy zgłoszenia z przeszłości

            parsed.push({
              provider: attr.provider || "Placówka",
              place: attr.place || "",
              address: [attr.address, attr.locality].filter(Boolean).join(", "),
              phone: attr.phone ? attr.phone.split(/[\/,;]/)[0].trim() : null,
              date: dateObj,
              days: diff
            });
          });

          page++;
        }

        // Sortowanie od najwcześniejszego terminu
        parsed.sort((a, b) => a.date - b.date);

        if (parsed.length === 0) {
          statusEl.textContent = `Brak placówek z wolnymi terminami dla: ${term}. Spróbuj wybrać konkretne województwo.`;
          return;
        }

        statusEl.textContent = `Znaleziono ${parsed.length} placówek z potwierdzonymi terminami:`;

        parsed.forEach((item, idx) => {
          const day = String(item.date.getDate()).padStart(2, "0");
          const month = MONTHS[item.date.getMonth()];
          const year = item.date.getFullYear();
          const card = document.createElement("article");
          card.className = "rounded-2xl bg-white p-5 shadow-sm ring-1 ring-zinc-900/5";

          card.innerHTML = `
            <div class="flex items-start justify-between gap-4">
              <div class="min-w-0 flex-1">
                <span class="text-[11px] font-bold text-teal-700 uppercase tracking-wider">#${idx + 1}</span>
                <h3 class="mt-1 font-semibold text-zinc-900 leading-snug">${item.provider}</h3>
                ${item.place ? `<p class="text-xs text-zinc-500 mt-0.5">${item.place}</p>` : ""}
                <p class="text-sm text-zinc-600 mt-2">${item.address}</p>
                <div class="mt-3 flex flex-wrap items-center gap-2">
                  ${item.phone ? `<a href="tel:${item.phone}" class="inline-flex items-center gap-1.5 rounded-full bg-teal-50 px-3 py-1 text-xs font-semibold text-teal-700 ring-1 ring-teal-100 hover:bg-teal-100">📞 ${item.phone}</a>` : ""}
                </div>
              </div>
              <div class="text-right shrink-0">
                <div class="flex items-baseline gap-1 justify-end">
                  <span class="text-3xl font-bold tracking-tight text-zinc-900 tabular-nums">${day}</span>
                  <span class="text-base font-semibold text-zinc-700">${month}</span>
                  <span class="text-xs text-zinc-400">${year}</span>
                </div>
                <div class="text-xs font-semibold text-teal-700 mt-1">
                  ${item.days === 0 ? "Dziś" : (item.days === 1 ? "Jutro" : `za ${item.days} dni`)}
                </div>
              </div>
            </div>
          `;
          resultsEl.appendChild(card);
        });

      } catch (err) {
        statusEl.textContent = "Błąd: " + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
